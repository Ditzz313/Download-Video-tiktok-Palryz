<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader Ultra UI</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{margin:0;background: radial-gradient(circle at top,#0f172a,#020617);color:white}

/* UI SAMA */
.container{max-width:420px;margin:80px auto;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:20px;text-align:center}
input{width:100%;padding:12px;border-radius:12px;border:none;margin-top:10px;background:#020617;color:white}
.btn{width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;background:#3b82f6;color:white;cursor:pointer}
video{width:100%;margin-top:15px;border-radius:12px}

.loader{
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  width:30px;height:30px;
  animation:spin 1s linear infinite;
  display:none;margin:15px auto
}
@keyframes spin{100%{transform:rotate(360deg)}}

.progressBox{display:none;margin-top:10px}
.progressBar{height:10px;background:#334155;border-radius:10px;overflow:hidden}
.progress{height:100%;width:0%;background:#22c55e}
</style></head><body><div class="container">
<div class="card"><h2>TikTok Downloader</h2><input id="url" placeholder="Paste link TikTok disini...">
<button class="btn" onclick="getVideo()">🚀 Download</button><div class="loader" id="loader"></div><div class="progressBox" id="progressBox">
  <div class="progressBar"><div class="progress" id="progress"></div></div>
  <div id="percent">0%</div>
</div><div id="result"></div></div>
</div><script>

let currentTitle = "tiktok-file"

function cleanName(text){
  return text.replace(/[^a-z0-9]/gi,'_').toLowerCase().substring(0,40)
}

async function getVideo(){
  let url = document.getElementById("url").value
  let loader = document.getElementById("loader")
  let result = document.getElementById("result")

  if(!url){
    alert("Masukkan link TikTok")
    return
  }

  if(!url.includes("tiktok.com")){
    alert("Link harus dari TikTok!")
    return
  }

  loader.style.display = "block"
  result.innerHTML = ""

  // progress fake
  let progress = document.getElementById("progress")
  let percent = document.getElementById("percent")
  let box = document.getElementById("progressBox")

  box.style.display = "block"
  progress.style.width = "30%"
  percent.innerText = "Memproses..."

  let api = "https://api.kriszzyy.xyz/downloader/tiktok?url=" + encodeURIComponent(url)

  try{
    let res = await fetch(api)
    let json = await res.json()

    loader.style.display = "none"
    progress.style.width = "70%"

    if(!json || !json.result){
      result.innerHTML = "Video tidak ditemukan / API error"
      box.style.display = "none"
      return
    }

    let video = json.result.video || json.result.nowm
    let audio = json.result.audio
    let caption = json.result.title || "tiktok"

    if(!video){
      result.innerHTML = "Video tidak tersedia"
      box.style.display = "none"
      return
    }

    currentTitle = cleanName(caption)

    let html = ""
    html += `<video controls src="${video}"></video>`
    html += `<p>${caption}</p>`

    html += `
    <button class='btn' onclick="forceDownload('${video}','${currentTitle}.mp4')">
    ⬇ Download Video
    </button>
    `

    if(audio){
      html += `
      <button class='btn' onclick="forceDownload('${audio}','${currentTitle}.mp3')">
      🎵 Download MP3
      </button>
      `
    }

    result.innerHTML = html

    progress.style.width = "100%"
    percent.innerText = "Selesai"

    setTimeout(()=>{box.style.display="none"},1500)

  }catch(e){
    loader.style.display = "none"
    result.innerHTML = "Gagal mengambil data (API kemungkinan down)"
    box.style.display = "none"
  }
}

async function forceDownload(url, filename){
  try{
    const res = await fetch(url)
    const blob = await res.blob()

    let link = document.createElement("a")
    link.href = URL.createObjectURL(blob)
    link.download = filename
    link.click()

  }catch{
    alert("Gagal download file")
  }
}

</script></body>
</html>
